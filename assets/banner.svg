ode-2{animation:floatNode 3.5s ease-in-out infinite .5s alternate}.ranking-node-3{animation:floatNode 4s ease-in-out infinite 1s alternate}.accent-rotate{transform-origin:1040px 190px;animation:spinSlow 24s linear infinite}.badge-glow{animation:badgePulse 3s ease-in-out infinite alternate}.scanner-line{animation:scanMove 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="16"/><g stroke="#38bdf8" stroke-width="1" opacity=".07"><line x1="100" x2="100" y1="0" y2="420"/><line x1="250" x2="250" y1="0" y2="420"/><line x1="400" x2="400" y1="0" y2="420"/><line x1="550" x2="550" y1="0" y2="420"/><line x1="700" x2="700" y1="0" y2="420"/><line x1="850" x2="850" y1="0" y2="420"/><line x1="1000" x2="1000" y1="0" y2="420"/><line x1="1150" x2="1150" y1="0" y2="420"/><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/></g><circle cx="150" cy="90" r="140" fill="#38bdf8" class="pulsing-glow" filter="url(#glow)" opacity=".12"/><circle cx="980" cy="200" r="180" fill="#a855f7" class="pulsing-glow" filter="url(#glow)" opacity=".15"/><circle cx="620" cy="360" r="130" fill="#6366f1" filter="url(#glow)" opacity=".1"/><path fill="none" stroke="url(#stream-grad)" stroke-width="2.5" d="M 680 140 Q 820 90, 940 160 T 1120 220" class="flowing-beam" filter="url(#soft-glow)"/><path fill="none" stroke="url(#primary-grad)" stroke-width="2" d="M 720 280 Q 860 330, 970 240 T 1140 180" class="flowing-beam-rev" opacity=".7"/><g class="accent-rotate" opacity=".35"><circle cx="1040" cy="190" r="95" fill="none" stroke="#38bdf8" stroke-dasharray="10 20 45 15" stroke-width="1.5"/><circle cx="1040" cy="190" r="120" fill="none" stroke="#a855f7" stroke-dasharray="6 35 18 20" stroke-width="1"/></g><g><g 